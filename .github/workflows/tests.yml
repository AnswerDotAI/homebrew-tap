# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  publish-fbz:
    if: github.event_name == 'pull_request'
    needs: test-bot
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Publish eligible fbz autobump bottles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          read -r state author head_repo head_ref head_sha < <(
            gh api "repos/$REPOSITORY/pulls/$pr" --jq '[.state, .user.login, .head.repo.full_name, .head.ref, .head.sha] | @tsv'
          )
          if [[ "$state" != open || "$author" != "github-actions[bot]" || "$head_repo" != "$REPOSITORY" || "$head_ref" != bump-fbz-* || ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "PR #$pr is not an eligible fbz autobump; nothing to publish"
            exit 0
          fi

          mapfile -t files < <(gh api --paginate "repos/$REPOSITORY/pulls/$pr/files" --jq '.[].filename')
          if [[ ${#files[@]} -ne 1 || "${files[0]}" != Formula/fbz.rb ]]
          then
            echo "PR #$pr does not exclusively update Formula/fbz.rb; nothing to publish"
            exit 0
          fi

          gh workflow run publish.yml --repo "$REPOSITORY" --ref main \
            -f pull_request="$pr" -f head_sha="$head_sha"
